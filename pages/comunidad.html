<!doctype html>
<!-- 
  Tarea: T32 - Responsable: Lucero Pipa - Descripción: Retos comunitarios, progreso por distrito y recompensas.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>document.documentElement.classList.add("js");</script>
    <title>Mink'a - Comunidad y Retos</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      media="print"
      onload="this.media=&#39;all&#39;"
    />
    <!-- Arquitectura CSS modular -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/fonts/Inter/Inter-Variable.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../assets/styles/core/base.css" />
    <link rel="stylesheet" href="../assets/styles/core/components.css" />
    <link rel="stylesheet" href="../assets/styles/core/layout.css" />
    <link rel="stylesheet" href="../assets/styles/pages/community.css" />
    <link rel="stylesheet" href="../assets/styles/core/responsive.css" />
    <!-- Scripts core -->
    <script defer src="../assets/scripts/core/components.js"></script>
    <script defer src="../assets/scripts/core/translations.js"></script>
    <script defer src="../assets/scripts/core/i18n.js"></script>
    <script src="../assets/scripts/core/session.js"></script>
    <script src="../assets/scripts/core/store.js"></script>
    <script src="../assets/scripts/core/modal.js"></script>
    <script src="../assets/scripts/core/toast.js"></script>
    <script src="../assets/scripts/core/guard.js"></script>
  </head>
  <body class="community-page">
    <a href="#main" class="skip-link">Saltar al contenido</a>
    <header id="app-header" class="auth-header"></header>

    <main id="main">
      <div class="container page-head">
        <h1 class="page-head__title" data-i18n="community_title">
          Retos Comunitarios
        </h1>
        <button
          type="button"
          class="page-head__info-btn"
          data-info-toggle
          aria-controls="page-info"
          aria-expanded="false"
          aria-label="Más información sobre esta página"
        >
          <i class="fas fa-info" aria-hidden="true"></i>
        </button>
        <p class="page-head__hint" id="page-info" hidden>
          Colabora con tu distrito, cumple metas y gana recompensas exclusivas.
        </p>
      </div>

      <div class="container">
        <div class="district-selector">
          <label for="district-select"
            ><i class="fas fa-map-marker-alt"></i> Viendo retos en:</label
          >
          <select id="district-select">
            <option value="Miraflores">Miraflores</option>
            <option value="Barranco">Barranco</option>
            <option value="San Isidro">San Isidro</option>
            <option value="Surco">Surco</option>
            <option value="San Borja">San Borja</option>
            <option value="Jesús María">Jesús María</option>
            <option value="Magdalena">Magdalena</option>
            <option value="La Molina">La Molina</option>
            <option value="Surquillo">Surquillo</option>
            <option value="Pueblo Libre">Pueblo Libre</option>
          </select>
          <div id="user-district-display" class="form__hint"></div>
        </div>

        <div id="challenges-grid" class="challenges-grid">
          <!-- Cards injected by JS -->
        </div>
      </div>
    </main>

    <footer id="app-footer" class="app-footer"></footer>

    <script src="../assets/scripts/core/notif-badge.js" defer></script>
    <script src="../assets/scripts/pages/community.js"></script>
  </body>
</html>
