<!doctype html>
<!-- 
  Tarea: T24 
  Responsable: Lucero Pipa 
  Descripción: Implementación de sistema de puntos, ranking y catálogo de canjes. 
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>document.documentElement.classList.add("js");</script>
    <title>Mink'a - Eco-Puntos y Gamificación</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      media="print"
      onload="this.media=&#39;all&#39;"
    />
    <!-- Arquitectura CSS modular -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/fonts/Inter/Inter-Variable.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../assets/styles/core/base.css" />
    <link rel="stylesheet" href="../assets/styles/core/components.css" />
    <link rel="stylesheet" href="../assets/styles/core/layout.css" />
    <link rel="stylesheet" href="../assets/styles/pages/gamification.css" />
    <link rel="stylesheet" href="../assets/styles/core/responsive.css" />
    <!-- Scripts core -->
    <script defer src="../assets/scripts/core/components.js"></script>
    <script defer src="../assets/scripts/core/translations.js"></script>
    <script defer src="../assets/scripts/core/i18n.js"></script>
    <script src="../assets/scripts/core/session.js"></script>
    <script src="../assets/scripts/core/store.js"></script>
    <script src="../assets/scripts/core/modal.js"></script>
    <script src="../assets/scripts/core/toast.js"></script>
    <script src="../assets/scripts/core/guard.js"></script>
  </head>
  <body class="gamification-page">
    <a href="#main" class="skip-link">Saltar al contenido</a>
    <header id="app-header" class="auth-header"></header>

    <main id="main" class="gamification-main">
      <div class="container">
        <!-- T24 - Lucero Pipa: Sección de Resumen de Puntos -->
        <section class="gamification-header">
          <div class="points-summary">
            <h1 data-i18n="gami_title">Mis Eco-Puntos</h1>
            <div class="points-display">
              <span class="points-value" id="user-points">0</span>
              <span class="points-label">pts</span>
            </div>
            <p class="points-level">
              Nivel: <span id="user-level">Novato</span>
            </p>
          </div>
          <div class="badges-summary">
            <h3 data-i18n="gami_badges">Mis Insignias</h3>
            <div class="badges-grid" id="user-badges">
              <!-- Badges will be injected here -->
            </div>
          </div>
        </section>

        <!-- T24 - Lucero Pipa: Navegación de Pestañas -->
        <div class="gamification-tabs">
          <button class="tab-btn active" data-tab="earn" data-i18n="gami_tab_earn">Ganar Puntos</button>
          <button class="tab-btn" data-tab="redeem" data-i18n="gami_tab_redeem">Canjear</button>
          <button class="tab-btn" data-tab="ranking" data-i18n="gami_tab_ranking">Ranking</button>
          <button class="tab-btn" data-tab="history" data-i18n="gami_tab_history">Historial</button>
        </div>

        <!-- T24 - Lucero Pipa: Contenido de Pestañas -->
        <div class="tab-content active" id="earn">
          <h2 data-i18n="gami_earn_title">¿Cómo ganar Eco-Puntos?</h2>
          <div class="earn-table-container">
            <table class="earn-table">
              <thead>
                <tr>
                  <th data-i18n="gami_th_action">Acción</th>
                  <th data-i18n="gami_th_points">Puntos</th>
                  <th data-i18n="gami_th_freq">Frecuencia</th>
                </tr>
              </thead>
              <tbody id="earn-actions-body">
                <!-- Actions injected via JS -->
              </tbody>
            </table>
          </div>
        </div>

        <div class="tab-content" id="redeem">
          <h2 data-i18n="gami_rewards_title">Catálogo de Recompensas</h2>
          <p>Canjea tus puntos por beneficios exclusivos.</p>
          <div class="rewards-grid" id="rewards-catalog">
            <!-- Rewards injected via JS -->
          </div>
        </div>

        <div class="tab-content" id="ranking">
          <div class="ranking-header">
            <h2 data-i18n="gami_ranking_title">Ranking Barrial</h2>
            <div class="ranking-controls">
              <label>
                <input type="checkbox" id="opt-out-ranking" /> No aparecer en
                rankings públicos
              </label>
            </div>
          </div>
          <div class="ranking-list" id="ranking-list">
            <!-- Ranking injected via JS -->
          </div>
        </div>

        <div class="tab-content" id="history">
          <h2 data-i18n="gami_history_title">Historial de Puntos</h2>
          <ul class="history-list" id="points-history">
            <!-- History injected via JS -->
          </ul>
        </div>
      </div>
    </main>

    <footer id="app-footer" class="app-footer"></footer>

    <script src="../assets/scripts/core/notif-badge.js"></script>
    <script src="../assets/scripts/pages/gamification.js"></script>
  </body>
</html>
